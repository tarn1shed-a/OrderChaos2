name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  resource-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-resources.txt
      - run: python tools/resource_tests.py
      - run: python tools/bdae_tests.py
      - run: python tools/bdae_attributes_tests.py
