name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  multiplayer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: prototype
      - run: pnpm test
        working-directory: prototype
  resource-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-resources.txt
      - run: python tools/resource_tests.py
      - run: python tools/bdae_tests.py
      - run: python tools/bdae_animation_tests.py
      - run: python tools/bdae_skin_tests.py
      - run: python tools/beff_effects_tests.py
      - run: python tools/skill_attachments_tests.py
      - run: python tools/scene_render_tests.py
      - run: python tools/ui_assets_tests.py
      - run: python tools/chinese_fonts_tests.py
      - run: python tools/skill_icons_tests.py
      - run: python tools/skill_ui_assets_tests.py
      - run: python tools/art_library_tests.py
      - run: python tools/hud_assets_tests.py
      - run: python tools/optimized_abc_tests.py
      - run: python tools/control_assets_tests.py
      - run: python tools/native_gameplay_tests.py
      - run: python tools/native_cast_tests.py
      - run: python tools/native_combat_tests.py
      - run: python tools/native_interaction_tests.py
      - run: python tools/quest_assets_tests.py
      - run: python tools/swf_ui_graphics_tests.py
      - run: python tools/terrain_materials_tests.py
      - run: python tools/scene_sampling_tests.py
      - run: python tools/navmesh_tests.py
      - run: python tools/player_spell_effects_tests.py
      - run: python tools/scene_collision_tests.py
      - run: python tools/character_portraits_tests.py
      - run: python tools/inventory_assets_tests.py
      - run: python tools/item_icons_tests.py
      - run: python tools/equipment_appearance_tests.py
      - run: python tools/character_hair_tests.py
      - run: python tools/character_materials_tests.py
